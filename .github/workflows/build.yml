name: Crear EXE
on: [push, workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name PinkNails pink_nails.py
      - uses: actions/upload-artifact@v4
        with:
          name: PinkNails-exe
          path: dist/PinkNails.exe
